name: Correction
description: A best known value, holder or statement that is wrong or out of date.
title: "Correction: PROBLEM_ID"
body:
  - type: input
    id: problem
    attributes:
      label: Problem or cell id
      placeholder: covering-40-6-4-10
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: The value, holder, statement or format, and what it should be.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Link to the keeper's page that shows it
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name or handle for the CHANGELOG (optional)
